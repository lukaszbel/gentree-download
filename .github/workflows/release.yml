# Runs in the public repository lukaszbel/gentree-download (copied there by build-windows.yml on every release).
# After each push of a new version: a GitHub Release with the installer as an asset – GitHub counts the downloads
# of release assets (not of files in the repository), so this gives the number of downloads per version.
# Uses the repository's own token – no extra secret.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release with the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          if gh release view "$V" >/dev/null 2>&1; then echo "Release $V already exists"; exit 0; fi
          awk '/^## /{n++} n==1' NOWOSCI.md | sed '1d' > notes.md
          gh release create "$V" Gentree-Setup.exe --title "Gentree $V" --notes-file notes.md --latest
